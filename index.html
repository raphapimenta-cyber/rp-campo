const uid=()=>crypto.randomUUID();const fields=()=>Object.fromEntries(schema.sections.map(s=>[s.key,{status:'Não avaliado',values:{},groups:Object.fromEntries(s.groups.map(g=>[g.key,[]]))}]));
const initial=()=>({version:2,id:uid(),property:{basis:'live30'},modules:[],lots:[],baseline:null,visit:{},updatedAt:''});
let state=initial(),step='property',lotId='',sectionKey='visita',loadError=false;
function validate(x){if(!x||x.version!==2||!x.property||!x.visit||!Array.isArray(x.modules)||!Array.isArray(x.lots))throw Error('Use uma exportação compatível V2/V3.');const ids=new Set();for(const m of x.modules){if(!m.id||ids.has(m.id))throw Error('Módulo inválido');ids.add(m.id)}const lots=new Set();for(const l of x.lots){if(!l.id||lots.has(l.id)||!ids.has(l.moduleId)||!l.current||!l.initial||!Array.isArray(l.attachments))throw Error('Lote inválido');lots.add(l.id);for(const s of schema.sections){const q=l.sections?.[s.key];if(!q||!q.values||!q.groups)throw Error('Bloco ausente');for(const k of Object.keys(q.values))if(!s.fields.some(f=>f.key===k))throw Error('Campo desconhecido');for(const g of s.groups){if(!Array.isArray(q.groups[g.key]))throw Error('Tabela ausente');for(const r of q.groups[g.key])for(const k of Object.keys(r))if(k!=='__recordId'&&!g.fields.some(f=>f.key===k))throw Error('Coluna desconhecida')}for(const k of Object.keys(q.groups))if(!s.groups.some(g=>g.key===k))throw Error('Tabela desconhecida')}for(const a of l.attachments)if(typeof a.name!=='string'||!/^data:(image\/(png|jpeg|webp)|application\/pdf);base64,/.test(a.data))throw Error('Anexo inválido')}if(x.baseline&&(!Array.isArray(x.baseline.lots)||!x.baseline.date||!['live30','carcass'].includes(x.baseline.basis)))throw Error('Referência inicial inválida')}
try{const raw=localStorage.getItem(KEY)||localStorage.getItem('rp-campo-prototipo-v9')||localStorage.getItem('rp-campo-prototipo-v8')||localStorage.getItem('rp-campo-prototipo-v7')||localStorage.getItem('rp-campo-prototipo-v6')||localStorage.getItem('rp-campo-prototipo-v5')||localStorage.getItem('rp-campo-prototipo-v4')||localStorage.getItem('rp-campo-prototipo-v3')||localStorage.getItem('rp-campo-prototipo-v2');if(raw){const x=JSON.parse(raw);validate(x);state=x}}catch(e){loadError=true}
function toast(s){document.querySelector('#message').textContent=s;setTimeout(()=>document.querySelector('#message').textContent='',6500)}
function save(){if(loadError){toast('Armazenamento anterior ilegível: exporte os dados desta sessão. O registro anterior não será sobrescrito.');return}state.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state));document.querySelector('#saveState').textContent='Salvo neste navegador'}catch(e){document.querySelector('#saveState').textContent='Não salvo: exporte agora';toast('Armazenamento cheio: exporte os dados.')}}
function input(label,key,value='',type='text',scope='p',options=[]){let el=type==='select'?`<select data-${scope}="${key}"><option value="">Selecionar…</option>${options.map(o=>`<option value="${esc(o[0])}" ${String(value)===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:type==='textarea'?`<textarea data-${scope}="${key}">${esc(value)}</textarea>`:`<input data-${scope}="${key}" type="${type}" ${type==='number'?(key.endsWith('|effective')?'step="any" min="0" max="100"':key.endsWith('|paddocks')?'step="1" min="0"':'step="any" min="0"'):''} value="${esc(value)}">`;return `<label class="${type==='textarea'?'wide':''}">${esc(label)}${el}</label>`}
const modname=id=>state.modules.find(m=>m.id===id)?.name||'Módulo sem nome';
const lot=()=>state.lots.find(l=>l.id===lotId);
function weight(v,basis=state.baseline?.basis||state.property.basis){v=categoryAggregate(v);const count=n(v.count),kg=n(v.weight),yieldPct=n(v.yield);if(!Number.isInteger(count)||count<0||kg===null||kg<0||(count>0&&kg===0))return null;if(basis==='live30')return count*kg/30;if(basis==='carcass'&&yieldPct>0&&yieldPct<=100)return count*kg*yieldPct/100/15;return null}
function total(rows,basis){if(!rows.length)return {count:null,arrobas:null};let count=0,a=0,ok=true,cok=true;for(const raw of rows){const r=categoryAggregate(raw);const c=n(r.count);if(!Number.isInteger(c)||c<0)cok=false;else count+=c;const w=weight(r,basis);if(w===null)ok=false;else a+=w}return {count:cok?count:null,arrobas:ok?a:null}}
function moduleSummary(initialRows=false){const b=state.baseline,basis=b?.basis||state.property.basis;return '<h3>Totais por módulo</h3>'+state.modules.map(m=>{const rows=initialRows?(b?b.lots.filter(l=>l.moduleId===m.id).map(l=>l.values):state.lots.filter(l=>l.moduleId===m.id).map(l=>l.initial)):state.lots.filter(l=>l.moduleId===m.id).map(l=>l.current);const t=total(rows,basis);return '<p><b>'+esc(m.name||'Módulo sem nome')+'</b>: '+fmt(t.count)+' animais · '+fmt(t.arrobas)+' @</p>'}).join('')}
function metrics(rows,basis){const t=total(rows,basis);return `<div class="metric-grid"><div class="metric">Animais<strong>${fmt(t.count)}</strong></div><div class="metric">Arrobas equivalentes<strong>${fmt(t.arrobas)} @</strong></div><div class="metric">Base<strong style="font-size:16px">${basis==='live30'?'Peso vivo ÷ 30':basis==='carcass'?'PV × rendimento ÷ 15':'Selecionar base'}</strong></div></div>`}
function nav(){document.querySelector('#steps').innerHTML=[['property','1. Propriedade'],['herd','2. Rebanho e @ iniciais'],['lots','3. Visita por lote']].map(([k,v])=>`<button data-step="${k}" class="${k===step?'selected':''}">${v}</button>`).join('');document.querySelector('#lotnav').innerHTML=step==='lots'?`<label>Lote em atendimento<select id="selectlot"><option value="">Selecionar lote…</option>${state.lots.map(l=>`<option value="${l.id}" ${l.id===lotId?'selected':''}>${esc(l.name||'Sem nome')} · ${esc(modname(l.moduleId))}</option>`).join('')}</select></label><nav>${schema.sections.map(s=>`<button data-section="${s.key}" class="${s.key===sectionKey?'active':''}">${esc(s.title)}</button>`).join('')}</nav>`:''}
function originalDraw(){nav();document.querySelector('#report').classList.add('hidden');document.querySelector('#print').classList.add('hidden');document.querySelector('#editor').classList.remove('hidden');document.querySelector('#editor').innerHTML=step==='property'?propertyUI():step==='herd'?herdUI():lotUI()}
const grades=['Sem sinais observados','Leve','Moderada','Acentuada','Muito acentuada'];
function gradeLegend(){return '<p class="small">Escala visual proposta para padronizar as visitas; não substitui avaliação técnica. Escolha somente após observar o módulo.</p><ol>'+['Cobertura e condição visual preservadas, sem sinais observados de degradação.','Sinais pontuais, com pequenas falhas ou redução localizada de vigor.','Sinais recorrentes em parte do módulo; falhas, invasoras ou perda de vigor evidentes.','Sinais extensos; cobertura bastante comprometida e áreas de solo exposto.','Comprometimento visual muito intenso, com grandes falhas de cobertura; registrar erosão quando observada.'].map((v,i)=>'<li><b>'+grades[i]+'</b>: '+v+'</li>').join('')+'</ol>'}
function effectiveArea(m){const a=n(m.area),p=n(m.effective);return a!==null&&Number.isFinite(a)&&a>=0&&p!==null&&Number.isFinite(p)&&p>=0&&p<=100?a*p/100:null}
function moduleAreaLabel(m){const a=effectiveArea(m),q=n(m.paddocks);return 'Área efetiva: '+(a===null?'não calculada — informe área e percentual entre 0 e 100':fmt(a)+' ha')+(q!==null&&(!Number.isInteger(q)||q<0)?' · Número de piquetes deve ser inteiro e não negativo.':'')}
function pastureSummary(){const modules=state.modules.filter(m=>(m.use||'pasture')==='pasture'),areas=modules.map(effectiveArea);const valid=modules.length&&areas.every(a=>a!==null);const sum=valid?areas.reduce((a,b)=>a+b,0):null;return '<b>Área efetiva de pastagens: '+(valid?fmt(sum)+' ha':'aguardando cadastro completo dos módulos de pastagem')+'</b><p class="small">Calculada automaticamente. '+modules.length+' módulo(s) de pastagem. '+(n(state.property.area)!==null&&sum>n(state.property.area)?'Atenção: o total efetivo supera a área da propriedade; confira sobreposição ou cadastro.':'')+'</p>'+(state.property.pasture!==undefined?'<p class="small">Valor manual anterior preservado para consulta: '+esc(state.property.pasture)+' ha. Não é usado no cálculo.</p>':'')}
function updatePasture(){const el=document.querySelector('#pastureTotal');if(el)el.innerHTML=pastureSummary();for(const m of state.modules){const el=document.querySelector('[data-effective="'+m.id+'"]');if(el)el.textContent=moduleAreaLabel(m)}}
function propertyUI(){const p=state.property;return `<h1>Pré-cadastro da propriedade</h1><p class="sub">Dados permanentes, módulos e referência inicial do acompanhamento.</p><div class="card grid">${input('Nome da propriedade','name',p.name)}${input('Proprietário / cliente','owner',p.owner)}${input('Área total (ha)','area',p.area,'number')}${input('Referência de 1 UA (kg de peso vivo)','kgUA',p.kgUA??450,'number')}<div class="wide summary" id="pastureTotal">${pastureSummary()}</div>${input('Aptidão / atividades','aptitude',p.aptitude,'text')}${input('Município / UF','city',p.city)}${input('Localização / endereço / acesso','location',p.location,'textarea')}${input('Latitude (texto, aceita sinal negativo)','latitude',p.latitude)}${input('Longitude (texto, aceita sinal negativo)','longitude',p.longitude)}${input('Data inicial do acompanhamento','date',p.date,'date')}${input('Número total de animais iniciais declarado','initialCount',p.initialCount,'number')}${state.baseline?`<p class="wide summary">Referência inicial registrada em ${esc(state.baseline.date)}. A base de cálculo ficou preservada no registro inicial; alterações no cadastro não modificam esse histórico.</p>`:'<p class="wide summary">Base adotada: peso vivo ÷ 30 kg. Arrobas do lote = animais × peso médio vivo ÷ 30.</p>'}</div><div class="card"><div class="rowhead"><h2>Módulos da propriedade</h2><button id="addmodule">+ Módulo</button></div><p class="small">Área efetiva = área em hectares × percentual efetivo ÷ 100. Apenas módulos com uso Pastagem entram no total de pastagens.</p><details><summary>Legenda de degradação (1 a 5)</summary>${gradeLegend()}</details>${state.modules.map(m=>`<div class="rowbox grid">${input('Nome do módulo',m.id+'|name',m.name,'text','m')}${input('Área (ha)',m.id+'|area',m.area,'number','m')}${input('Aptidão do módulo',m.id+'|aptitude',m.aptitude,'text','m')}${input('Cultura plantada (escrever)',m.id+'|crop',m.crop,'text','m')}${input('Uso da área',m.id+'|use',m.use||'pasture','select','m',[['pasture','Pastagem'],['other','Outra cultura / uso']])}${input('Área efetiva (%)',m.id+'|effective',m.effective,'number','m')}${input('Número de piquetes',m.id+'|paddocks',m.paddocks,'number','m')}${input('Nível de degradação',m.id+'|degradation',m.degradation,'select','m',grades.map((v,i)=>[String(i+1),(i+1)+' — '+v]))}${input('Localização / observações anteriores',m.id+'|location',m.location,'text','m')}<div class="wide small" data-effective="${m.id}">${moduleAreaLabel(m)}</div></div>`).join('')||'<p>Cadastre os módulos para distribuir os lotes.</p>'}</div><button class="primary" data-step="herd">Continuar para o rebanho →</button>`}
function herdUI(){const b=state.baseline,basis=b?.basis||state.property.basis;const rows=b?b.lots.map(l=>l.values):state.lots.map(l=>l.initial);const t=total(rows,basis);const declared=n(b?b.declared:state.property.initialCount);return `<h1>Rebanho por módulo e lote</h1><p class="sub">Preencha quantidade e peso médio vivo de cada lote. Registre a referência inicial uma única vez; depois atualize o rebanho atual.</p><div class="card"><h2>${b?'Referência inicial preservada':'Conferência da referência inicial'}</h2><div id="initialMetrics">${metrics(rows,basis)}${moduleSummary(true)}<p>Data inicial: ${esc(b?.date||state.property.date||'Não informada')} · Total declarado: ${fmt(declared)} · Diferença na distribuição: ${declared!==null&&t.count!==null?fmt(t.count-declared):'Não calculada'}</p></div>${b?`<p class="small">${b.lots.map(l=>esc(l.name)+' · '+esc(l.moduleName)+': '+fmt(n(l.values.count))+' animais / '+fmt(weight(l.values,b.basis))+' @').join('<br>')}</p>`:`<button id="freeze" class="primary">Registrar referência inicial</button>`}</div><div class="card"><div class="rowhead"><h2>Lotes cadastrados</h2><button id="addlot">+ Lote</button></div>${state.lots.map(l=>`<div class="rowbox"><div class="grid">${input('Nome / identificação do lote',l.id+'|name',l.name,'text','l')}${input('Módulo atual',l.id+'|moduleId',l.moduleId,'select','l',state.modules.map(m=>[m.id,m.name||'Sem nome']))}${input('Descrição / aptidão do lote (opcional)',l.id+'|category',l.category,'text','l')}</div>${!b?`<h3>Rebanho inicial</h3><div class="grid">${herdFields(l,'initial')}</div>`:''}<h3>Rebanho atual</h3><div class="grid">${herdFields(l,'current')}</div><p class="small">Data atual: ${esc(l.current.date||'Não informada')} · <span data-lotmetric="${l.id}">${fmt(weight(l.current,basis))} @</span>. As quantidades e pesos atuais não alteram o registro inicial.</p><button data-openlot="${l.id}">Preencher todos os temas deste lote →</button></div>`).join('')||'<p>Adicione um lote e selecione seu módulo.</p>'}</div><div class="card"><h2>Rebanho atual consolidado</h2><div id="stocking">${stocking()}</div><div id="currentMetrics">${metrics(state.lots.map(l=>l.current),basis)}${moduleSummary()}</div><p class="small">O consolidado representa uma posição única somente quando todos os lotes têm a mesma data. Arrobas atuais menos iniciais são variação de estoque, não produção: compras, vendas, transferências externas e perdas precisam compor o balanço do período.</p></div>`}
function oldHerdFields(l,k){return input('Data da posição',l.id+'|'+k+'|date',l[k].date,'date','h')+input('Número de animais',l.id+'|'+k+'|count',l[k].count,'number','h')+input('Peso médio vivo por animal (kg)',l.id+'|'+k+'|weight',l[k].weight,'number','h')+((state.baseline?.basis||state.property.basis)==='carcass'?input('Rendimento de carcaça informado (%)',l.id+'|'+k+'|yield',l[k].yield,'number','h'):'')+input('Origem do peso / condições da pesagem',l.id+'|'+k+'|source',l[k].source,'text','h')}
function categoryAggregate(v){if(!Array.isArray(v.categories))return v;if(!v.categories.length)return {...v,count:'',weight:''};let count=0,kg=0;for(const c of v.categories){const q=n(c.count),w=n(c.weight);if(!Number.isInteger(q)||q<0||w===null||!Number.isFinite(w)||w<0||(q>0&&w===0))return {...v,count:'',weight:''};count+=q;kg+=q*w}return {...v,count,weight:count?kg/count:0}}
function ensureCategories(l,k){if(!Array.isArray(l[k].categories)){const v=l[k];v.categories=(v.count!==''&&v.count!==undefined)||(v.weight!==''&&v.weight!==undefined)?[{name:l.category||'Categoria anterior',count:v.count,weight:v.weight}]:[]}}
function herdFields(l,k){ensureCategories(l,k);const v=l[k];return input('Data da posição',l.id+'|'+k+'|date',v.date,'date','h')+input('Origem dos pesos / observações',l.id+'|'+k+'|source',v.source,'text','h')+`<div class="wide"><h3>Categorias deste lote</h3><p class="small">Inclua bezerros ao pé, touros, novilhas, aleijados ou qualquer outra categoria. Conte cada animal apenas uma vez, mesmo quando estiver ao pé da matriz.</p>${v.categories.map((c,i)=>`<div class="rowbox grid">${input('Categoria (escrever)',l.id+'|'+k+'|'+i+'|name',c.name,'text','cat')}${input('Raça',l.id+'|'+k+'|'+i+'|breed',c.breed,'text','cat')}${input('Número de animais',l.id+'|'+k+'|'+i+'|count',c.count,'number','cat')}${input('Peso médio vivo da categoria (kg)',l.id+'|'+k+'|'+i+'|weight',c.weight,'number','cat')}<button data-delcat="${l.id}|${k}|${i}">Excluir categoria</button></div>`).join('')}<button data-addcat="${l.id}|${k}">+ Adicionar categoria</button><p data-categorytotal="${l.id}|${k}">${categoryTotal(v)}</p></div>`}
function categoryTotal(v){const a=categoryAggregate(v);return 'Total: '+fmt(n(a.count))+' animais · peso médio ponderado: '+fmt(n(a.weight))+' kg · '+fmt(weight(v))+' @'}
function categoryReport(v){return (v.categories||[]).map(c=>kv('Categoria: '+(c.name||'não informada'),(c.breed?c.breed+' · ':'')+fmt(n(c.count))+' animais · '+fmt(n(c.weight))+' kg médios')).join('')}
function stocking(){const ua=n(state.property.kgUA??450);const mods=state.modules.filter(m=>(m.use||'pasture')==='pasture');let totalKg=0,totalCount=0,totalArea=0,valid=ua>0&&mods.length>0;let html='<h3>Lotação atual</h3><p class="small">UA = peso vivo total ÷ referência em kg/UA; lotação = UA ÷ área efetiva de pastagens. Referência adotada: '+fmt(ua)+' kg/UA (ajustável no cadastro). Posições com datas diferentes não representam um fechamento único.</p>';for(const m of state.modules){const rows=state.lots.filter(l=>l.moduleId===m.id).map(l=>categoryAggregate(l.current)),area=effectiveArea(m);let kg=0,cnt=0,ok=rows.length>0;for(const r of rows){if(n(r.count)===null||n(r.weight)===null){ok=false;break}cnt+=n(r.count);kg+=n(r.count)*n(r.weight)}const pasture=(m.use||'pasture')==='pasture';html+='<p><b>'+esc(m.name||'Módulo sem nome')+'</b>: '+(ok?fmt(cnt):'Não calculado')+' animais · '+(ok&&ua>0?fmt(kg/ua):'Não calculado')+' UA · '+(pasture&&ok&&area>0&&ua>0?fmt(kg/ua/area):'Não calculado')+' UA/ha · '+(pasture&&ok&&area>0?fmt(cnt/area):'Não calculado')+' cabeças/ha'+(!pasture?' (fora do total de pastagens)':'')+'</p>';if(pasture){if(!ok||!(area>0))valid=false;else{totalKg+=kg;totalCount+=cnt;totalArea+=area}}}return html+'<p><b>Total nas pastagens: '+(valid?fmt(totalCount)+' animais · '+fmt(totalKg/ua)+' UA · '+fmt(totalKg/ua/totalArea)+' UA/ha · '+fmt(totalCount/totalArea)+' cabeças/ha':'não calculado — complete categorias, áreas efetivas e referência UA')+'</b></p>'}
function sf(f,val,scope,key){return input(f.label,key,val,f.type,scope,(f.options||[]).map(x=>[x,x]))}
function previousLotUI(){const l=lot();if(!l)return '<h1>Visita por lote</h1><p>Selecione um lote ou cadastre o rebanho na etapa anterior.</p>';const s=schema.sections.find(s=>s.key===sectionKey),q=l.sections[s.key];return `<div class="lot-title"><strong>${esc(l.name||'Lote sem nome')}</strong> · ${esc(modname(l.moduleId))}<div>${esc(l.category||'Categoria não informada')}</div></div><h1>${esc(s.title)}</h1><p class="sub">Todos os dados abaixo pertencem exclusivamente a este lote.</p><div class="card grid">${input('Data da visita','date',state.visit.date,'date','v')}${input('Consultor responsável','consultant',state.visit.consultant,'text','v')}${input('Situação deste tema no lote','status',q.status,'select','status',[['Não avaliado','Não avaliado'],['Avaliado','Avaliado'],['Não se aplica','Não se aplica']])}${s.fields.map(f=>sf(f,q.values[f.key],'field',f.key)).join('')}</div>${s.groups.map(g=>`<div class="card"><div class="rowhead"><h2>${esc(g.label)}</h2><button data-addrow="${g.key}">+ Registro</button></div>${q.groups[g.key].map((r,i)=>`<div class="rowbox"><div class="rowhead"><b>Registro ${i+1}</b><button data-delrow="${g.key}|${i}">Excluir</button></div><div class="grid">${g.fields.map(f=>sf(f,r[f.key],'cell',g.key+'|'+i+'|'+f.key)).join('')}</div></div>`).join('')}</div>`).join('')}${s.key==='anexos'?`<div class="card"><h2>Fotos e documentos deste lote</h2><p class="small">Até 1 MB por arquivo, 2 MB no conjunto desta demonstração.</p><input id="attachment" type="file" accept="image/png,image/jpeg,image/webp,application/pdf">${l.attachments.map((a,i)=>`<div class="filecard">${esc(a.name)}${a.type.startsWith('image/')?`<img src="${a.data}">`:''}${input('Legenda / origem',String(i),a.caption,'text','caption')}<button data-delattachment="${i}">Excluir</button></div>`).join('')}</div>`:''}`}
function freeze(){if(state.baseline)return;for(const l of state.lots)l.initial=categoryAggregate(l.initial);const p=state.property,basis=p.basis;if(!p.name||!p.date||!['live30','carcass'].includes(basis)||!state.lots.length)return toast('Informe propriedade, data, base de cálculo e lotes.');const t=total(state.lots.map(l=>l.initial),basis);if(t.count===null||t.arrobas===null||n(p.initialCount)!==t.count)return toast('Confira pesos, quantidades, rendimento e o total declarado: a distribuição precisa fechar.');if(state.lots.some(l=>!l.name||!l.moduleId||l.initial.date!==p.date))return toast('Nomeie os lotes e use a mesma data inicial em todos.');state.baseline={date:p.date,basis,declared:p.initialCount,recordedAt:new Date().toISOString(),lots:state.lots.map(l=>({id:l.id,name:l.name,moduleId:l.moduleId,moduleName:modname(l.moduleId),values:structuredClone(l.initial)}))};for(const l of state.lots)if(n(categoryAggregate(l.current).count)===null&&(!l.current.categories||!l.current.categories.length))l.current=structuredClone(l.initial);save();draw();toast('Referência inicial registrada e preservada.');}
function indicators(l,s){const rows=[],q=l.sections[s.key];if(s.key==='pesagens')for(const r of q.groups.pesos){const days=(Date.parse(r.fim)-Date.parse(r.inicio))/86400000,a=n(r.pesoInicial),b=n(r.pesoFinal);rows.push(['GMD de '+(r.animal||'animal sem identificação')+' (kg/dia)',days>0&&a!==null&&b!==null?fmt((b-a)/days):'Não calculado'])}if(s.key==='reproducao'){const a=n(q.values.prenhas),b=n(q.values.avaliadas);rows.push(['Prenhez entre avaliadas (%)',b>0&&a!==null&&a>=0&&a<=b?fmt(100*a/b):'Não calculada'])}if(s.key==='nutricao')for(const r of q.groups.consumos){const a=n(r.oferta),b=n(r.sobras),c=n(r.cabecas),d=n(r.dias);rows.push(['Consumo aparente (kg/cabeça/dia)',a!==null&&b!==null&&a>=b&&b>=0&&c>0&&d>0?fmt((a-b)/c/d):'Não calculado'])}return rows.length?'<h4>Indicadores deste lote</h4>'+rows.map(([k,v])=>kv(k,v)).join(''):''}
function kv(k,v){return `<div class="kv"><b>${esc(k)}</b><div>${esc(v===undefined||v===''?'Não informado':v)}</div></div>`}

function updateMetrics(){if(step!=='herd')return;const st=document.querySelector('#stocking');if(st)st.innerHTML=stocking();for(const l of state.lots)for(const k of ['initial','current']){const el=document.querySelector('[data-categorytotal="'+l.id+'|'+k+'"]');if(el)el.textContent=categoryTotal(l[k]);}const b=state.baseline,basis=b?.basis||state.property.basis;const rows=b?b.lots.map(l=>l.values):state.lots.map(l=>l.initial);const t=total(rows,basis),declared=n(b?.declared??state.property.initialCount);document.querySelector('#initialMetrics').innerHTML=metrics(rows,basis)+moduleSummary(true)+`<p>Data inicial: ${esc(b?.date||state.property.date||'Não informada')} · Total declarado: ${fmt(declared)} · Diferença: ${declared!==null&&t.count!==null?fmt(t.count-declared):'Não calculada'}</p>`;document.querySelector('#currentMetrics').innerHTML=metrics(state.lots.map(l=>l.current),basis)+moduleSummary();for(const l of state.lots)document.querySelector(`[data-lotmetric="${l.id}"]`).textContent=fmt(weight(l.current,basis))+' @'}
document.addEventListener('input',e=>{const d=e.target.dataset,v=e.target.value;if(d.cat){const [id,k,i,f]=d.cat.split('|');if(k==='initial'&&state.baseline)return;const l=state.lots.find(l=>l.id===id);l[k].categories[Number(i)][f]=v;Object.assign(l[k],categoryAggregate(l[k]));}else if(d.p)state.property[d.p]=v;else if(d.m){const [id,k]=d.m.split('|');state.modules.find(m=>m.id===id)[k]=v}else if(d.l){const [id,k]=d.l.split('|');state.lots.find(l=>l.id===id)[k]=v}else if(d.h){const [id,k,f]=d.h.split('|');if(k==='initial'&&state.baseline)return;state.lots.find(l=>l.id===id)[k][f]=v}else if(d.v)state.visit[d.v]=v;else if(d.status)lot().sections[sectionKey].status=v;else if(d.field)lot().sections[sectionKey].values[d.field]=v;else if(d.cell){const [g,i,k]=d.cell.split('|');lot().sections[sectionKey].groups[g][i][k]=v}else if(d.caption!==undefined)lot().attachments[Number(d.caption)].caption=v;else return;save();updateMetrics();updatePasture()});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;if(d.addcat){const [id,k]=d.addcat.split('|');if(k==='initial'&&state.baseline)return;const l=state.lots.find(l=>l.id===id);ensureCategories(l,k);l[k].categories.push({name:'',count:'',weight:''});Object.assign(l[k],categoryAggregate(l[k]));save();draw()}else if(d.delcat){if(!confirm('Excluir esta categoria?'))return;const [id,k,i]=d.delcat.split('|');if(k==='initial'&&state.baseline)return;const l=state.lots.find(l=>l.id===id);l[k].categories.splice(Number(i),1);Object.assign(l[k],categoryAggregate(l[k]));save();draw()}else if(d.step){step=d.step;draw()}else if(d.section){sectionKey=d.section;draw()}else if(d.openlot){lotId=d.openlot;step='lots';draw()}else if(t.id==='addmodule'){state.modules.push({id:uid(),name:'',area:'',aptitude:'',location:'',crop:'',effective:'',paddocks:'',degradation:'',use:'pasture'});save();draw()}else if(t.id==='addlot'){if(!state.modules.length)return toast('Cadastre pelo menos um módulo.');const blank={date:state.property.date||'',count:'',weight:'',yield:'',source:''};state.lots.push({id:uid(),name:'',moduleId:state.modules[0].id,category:'',initial:structuredClone(blank),current:{date:'',count:'',weight:'',yield:'',source:''},sections:fields(),attachments:[]});save();draw()}else if(t.id==='freeze')freeze();else if(d.addrow&&lot()){lot().sections[sectionKey].groups[d.addrow].push({});save();draw()}else if(d.delrow&&confirm('Excluir este registro do lote?')){const [g,i]=d.delrow.split('|');lot().sections[sectionKey].groups[g].splice(Number(i),1);save();draw()}else if(d.delattachment!==undefined&&confirm('Excluir este anexo do lote?')){lot().attachments.splice(Number(d.delattachment),1);save();draw()}});

document.addEventListener('change',async e=>{if(e.target.id==='selectlot'){lotId=e.target.value;draw()}else if(e.target.id==='importfile'){try{const f=e.target.files[0];if(!f)return;if(f.size>8000000)throw Error('Limite de 8 MB');const x=JSON.parse(await f.text());validate(x);if(confirm('Substituir os dados abertos? Exporte-os antes para guardar uma cópia.')){state=x;lotId='';step='property';loadError=false;save();draw()}}catch(err){toast('Importação recusada: '+err.message)}e.target.value=''}else if(e.target.id==='attachment'){const target=lot();const f=e.target.files[0];if(!f||!target)return;if(!['image/png','image/jpeg','image/webp','application/pdf'].includes(f.type)||f.size>1000000||state.lots.flatMap(l=>l.attachments).reduce((s,a)=>s+a.size,0)+f.size>2000000)return toast('Limite: 1 MB por arquivo, 2 MB no total.');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});target.attachments.push({name:f.name,type:f.type,size:f.size,data,caption:''});save();draw()}});

async function takePhoto(e){const f=e.target.files[0],target=photoTarget?{...photoTarget}:null;if(!f||!target)return;try{if(!f.type.startsWith('image/'))throw Error('Selecione uma imagem.');const data=await new Promise((resolve,reject)=>{const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{try{const ratio=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*ratio);c.height=Math.round(im.height*ratio);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',0.78))}catch(err){reject(err)}finally{URL.revokeObjectURL(url)}};im.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Formato não suportado. Use JPEG ou PNG.'))};im.src=url});const bytes=Math.ceil(data.length*3/4),l=state.lots.find(l=>l.id===target.lotId);if(!l)throw Error('Lote não encontrado.');const all=state.lots.flatMap(l=>l.attachments).reduce((n,a)=>n+(a.size||0),0);if(bytes>1000000||all+bytes>2000000)throw Error('Limite local de fotos atingido (2 MB). Exporte os dados antes de continuar.');l.attachments.push({name:f.name.replace(/\.[^.]+$/,'')+'.jpg',type:'image/jpeg',size:bytes,data,caption:target.label+' · '+schema.sections.find(s=>s.key===target.section).title,recordId:target.recordId,section:target.section,group:target.group,capturedAt:new Date().toISOString()});save();draw();toast('Foto vinculada ao registro.')}catch(err){toast(err.message)}finally{e.target.value=''}}camera.onchange=takePhoto;gallery.onchange=takePhoto;

function nutritionData(l){return l.nutritionV6||(l.nutritionV6={})}
function nutritionCalc(l){const v=nutritionData(l),a=categoryAggregate(l.current),pv=n(a.weight),count=n(a.count),fdn=n(v.fdn),pb=n(v.grassPB),dose=n(v.newDose),spb=n(v.newPB);const forage=pv>0&&fdn>0&&fdn<=100?(1.2/fdn)*pv:null;const grassProtein=forage!==null&&pb!==null&&pb>=0&&pb<=100?forage*pb/100:null;const supplement=dose!==null&&dose>=0&&spb!==null&&spb>=0&&spb<=100?dose*spb/100:null;const protein=grassProtein!==null&&supplement!==null?grassProtein+supplement:null;return {pv,count,forage,grassProtein,supplement,protein}}
function nutritionResults(l){const v=nutritionData(l),c=nutritionCalc(l),req=proteinRequirement(l);let h=`<div class="summary"><b>PB estimada — fornecimento pleno do produto novo</b><p class="small">${v.reqMode==='pasture'?'BR-CORTE 2023, tabela 17.12a; interpolação por categoria. Se fora do domínio, exigência não calculada.':'Exigência informada pelo consultor a partir do BR-CORTE 2023.'} <a href="https://brcorte.com.br/assets/book2023/br/17.pdf" target="_blank" rel="noopener">Fonte</a></p>${kv('Consumo estimado de forragem (kg MS/cabeça/dia)',fmt(c.forage))}${kv('PB da forragem (kg/cabeça/dia)',fmt(c.grassProtein))}${kv('PB do suplemento (kg/cabeça/dia)',fmt(c.supplement))}${kv('PB total (kg/cabeça/dia)',fmt(c.protein))}${kv('PB total do lote (kg/dia)',fmt(c.protein!==null&&c.count!==null?c.protein*c.count:null))}${kv('Exigência PB informada do BR-CORTE (kg/cabeça/dia)',fmt(req))}${kv('Saldo: fornecida − exigida (kg/cabeça/dia)',fmt(c.protein!==null&&req>0?c.protein-req:null))}</div>`;if(v.adaptation){const old=n(v.oldDose),next=n(v.newDose);if(old===null||old<0||next===null||next<0)h+='<p>Informe as quantidades diárias completas dos dois produtos para calcular a adaptação.</p>';else h+='<h3>Adaptação</h3>'+[[1,4,2/3,1/3],[5,8,1/3,2/3],[9,null,0,1]].map(([start,end,of,nf])=>`<div class="summary"><b>${end?'Dias '+start+' a '+end:'A partir do dia 9'}</b><p>${esc(v.oldProduct||'Produto anterior')}: ${fmt(old*of)} kg/cabeça/dia · ${esc(v.newProduct||'Produto novo')}: ${fmt(next*nf)} kg/cabeça/dia</p><p>Lote: anterior ${fmt(c.count!==null?old*of*c.count:null)} kg/dia + novo ${fmt(c.count!==null?next*nf*c.count:null)} kg/dia</p></div>`).join('')}return h}
function nutritionUI(l){const v=nutritionData(l),s=schema.sections.find(s=>s.key==='nutricao'),g=s.groups.find(g=>g.key==='consumos');if(!l.sections.nutricao.groups.consumos.length)l.sections.nutricao.groups.consumos.push({});const r=l.sections.nutricao.groups.consumos[0];return `<h2>Nutrição</h2><div class="card grid">${input('FDN da forragem (% da matéria seca; exemplo: 60)','fdn',v.fdn,'number','nut')}${input('Proteína bruta da forragem (% da MS)','grassPB',v.grassPB,'number','nut')}${input('Produto novo / atual','newProduct',v.newProduct,'text','nut')}${input('Quantidade total do produto novo (kg/cabeça/dia)','newDose',v.newDose,'number','nut')}${input('PB do suplemento (% do produto como fornecido)','newPB',v.newPB,'number','nut')}<label class="wide"><span><input style="width:auto;min-height:0" type="checkbox" id="adaptation" ${v.adaptation?'checked':''}> Calcular adaptação</span></label>${v.adaptation?input('Produto anterior','oldProduct',v.oldProduct,'text','nut')+input('Quantidade total do produto anterior (kg/cabeça/dia)','oldDose',v.oldDose,'number','nut'):''}${input('Referência de exigência PB','reqMode',v.reqMode||'manual','select','nut',[['manual','Valor consultado no BR-CORTE 2023'],['pasture','Tabela 17.12a: somente machos não castrados zebuínos a pasto']])}${input('Ganho médio diário desejado (kg/cabeça/dia)','gmd',v.gmd,'number','nut')}${input('PB consultada (kg/cabeça/dia; usada no modo manual)','requirement',v.requirement,'number','nut')}${input('Referência da exigência: versão / categoria / GMD','reference',v.reference,'text','nut')}</div><p class="small">FDN e PB em porcentagem: informe 60 para 60%. Consumo de forragem = (1,2 ÷ FDN em %) × peso vivo médio. BR-CORTE 2023: a tabela 17.12a é exclusiva de machos não castrados zebuínos a pasto, de 210 a 630 kg e GMD de 0,3 a 1,8. Valores intermediários usam interpolação linear aproximada, por categoria, sem extrapolar. Para outros perfis, informe a PB consultada no livro. Não aplique a tabela a um lo const pbPasture=[[402,573,744,916],[475,658,842,1025],[546,744,943,1141],[614,827,1041,1254],[668,877,1087,1295],[720,926,1130,1334],[771,972,1173,1371],[821,1018,1213,1407]];
function tablePB(w,g){if(w<210||w>630||g<0.3||g>1.8||!Number.isFinite(w)||!Number.isFinite(g))return null;const wi=Math.min(6,Math.floor((w-210)/60)),gi=Math.min(2,Math.floor((g-.3)/.5)),wx=(w-(210+wi*60))/60,gx=(g-(.3+gi*.5))/.5;const a=pbPasture[wi][gi]*(1-gx)+pbPasture[wi][gi+1]*gx,b=pbPasture[wi+1][gi]*(1-gx)+pbPasture[wi+1][gi+1]*gx;return (a*(1-wx)+b*wx)/1000}

// Until v17 the farms, the photos and the Google Drive report queue lived only in localStorage, which holds a few MB
// per app. When it filled up, the Word report was dropped from the Drive queue ("pouco espaço no aparelho"). From v18:
// - the report queue lives in IndexedDB, the browser database, which has far more room (layer v18f);
// - when localStorage cannot hold the farms, they are saved in IndexedDB. Each copy carries a save number (seq18) and
//   the copy with the higher number is loaded at startup. The older localStorage copy is kept as it was.
// This block comes first so that the start-up saves of the other layers already go through it.

async function syncNow(reason){if(!syncConfigured()){setSyncStatus('off');return}if(!navigator.onLine){setSyncStatus('offline');return}if(loadError||farmStoreError||productError){setSyncStatus('error','Armazenamento do aparelho não recuperado; exporte os dados.');return}if(syncing){syncAgain=true;return}syncing=true;setSyncStatus('busy');let redraw=false;
 try{flushSave();if(stampFarm(state))saveImmediate();
  const index=(await api('index')).docs||[];const need=index.filter(r=>sync12.known[r.id]?.rev!==r.rev).map(r=>r.id);
  for(let i=0;i<need.length;i+=8){const docs=(await api('get',{ids:need.slice(i,i+8)})).docs||[];for(const d of docs){if(applyRemote(d)){sync12.known[d.id]={rev:d.rev,hash:docHash(d.id,d.data)};redraw=true}}}
  storeSync();let pending=localDocs().filter(d=>sync12.known[d.id]?.hash!==d.hash);
  for(let attempt=0;attempt<3&&pending.length;attempt++){const res=(await api('put',{docs:pending.map(d=>({id:d.id,name:d.name,baseRev:sync12.known[d.id]?.rev||0,data:d.data}))})).results||[];const retry=[];for(const r of res){const d=pending.find(x=>x.id===r.id);if(!d)continue;if(r.conflict){const fresh=((await api('get',{ids:[r.id]})).docs||[])[0];if(fresh&&applyRemote(fresh)){sync12.known[fresh.id]={rev:fresh.rev,hash:docHash(fresh.id,fresh.data)};redraw=true}const again=localDocs().find(x=>x.id===r.id);if(again&&again.hash!==sync12.known[r.id]?.hash)retry.push(again)}else if(r.error)throw Error(r.error);else sync12.known[r.id]={rev:r.rev,hash:d.hash}}storeSync();pending=retry}
  sync12.lastSync=new Date().toISOString();sync12.lastError='';localDirty=pending.length>0;storeSync();setSyncStatus('ok')}
 catch(e){const net=e instanceof TypeError||e.name==='AbortError';sync12.lastError=e.name==='AbortError'?'Tempo esgotado (internet lenta).':net?'Sem conexão com o servidor.':(e.message||String(e));storeSync();setSyncStatus(net||!navigator.onLine?'offline':'error',sync12.lastError)}

function lotFeed(l,f){const v=l.v12||{},s=suppOf(v.supp),st=lotStats(l,f);const manual=num(v.dose);const dose=manual!==null&&manual>=0?manual:(s&&st.weight!==null?st.weight*num(s.pct)/100:null);const lotKg=dose!==null&&st.count!==null?dose*st.count:null;const bag=num(settings12.bagKg)>0?num(settings12.bagKg):30;const cm=s?num(s.cocho):null;const need=cm!==null&&st.count!==null?st.count*cm/100:null;const cocho=num(v.cocho);return {name:v.supp||'',pct:s?num(s.pct):null,manual:manual!==null,dose,lotKg,bags:lotKg!==null?lotKg/bag:null,cochoNeed:need,cocho,cochoAdj:need!==null&&cocho!==null?cocho-need:null}}
function modStats(m,f){const lots=f.lots.filter(l=>l.moduleId===m.id);let ua=0,count=0,unknown=false;for(const l of lots){const s=lotStats(l,f);if(s.ua===null){unknown=true;if(s.count>0)count+=s.count;continue}ua+=s.ua;count+=s.count}const area=effectiveArea(m),pasture=(m.use||'pasture')==='pasture';return {lots,ua,count,unknown,area,pasture,uaha:pasture&&area>0?ua/area:null,occupation:count>0?'Ocupado':unknown?'Contagem pendente':'Descanso'}}

function stockRows(f){const v=f.visit||{},stock=v.stockV12||{},used={};for(const l of f.lots){const fd=lotFeed(l,f);if(fd.name){used[fd.name]=(used[fd.name]||0)+(fd.lotKg||0)}}const names=[...new Set([...Object.keys(used),...Object.keys(stock)])];return names.map(name=>{const est=num(stock[name]),daily=used[name]||0;return {name,est,daily,need30:est!==null?daily*30-est:daily*30}})}

function table12(head,rows,total){return `<div class="tw12"><table class="t12"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>${total?`<tfoot><tr>${total.map(c=>`<td>${esc(c)}</td>`).join('')}</tr></tfoot>`:''}</table></div>`}
function bullets(lines){return lines.length?'<ul class="b12">'+lines.map(l=>`<li>${esc(l)}</li>`).join('')+'</ul>':''}
function pie12(counts){const total=counts.reduce((a,[, c])=>a+c,0);if(!total)return '';const colors=['#00b050','#ffff00','#548235','#ffc000','#4472c4'];let a=-Math.PI/2,paths='';counts.forEach(([,c],i)=>{if(!c)return;const a2=a+2*Math.PI*c/total;if(c===total){paths+=`<circle cx="100" cy="100" r="90" fill="${colors[i]}"/>`}else{const x1=100+90*Math.cos(a),y1=100+90*Math.sin(a),x2=100+90*Math.cos(a2),y2=100+90*Math.sin(a2);paths+=`<path d="M100 100L${x1.toFixed(2)} ${y1.toFixed(2)}A90 90 0 ${a2-a>Math.PI?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z" fill="${colors[i]}" stroke="#fff" stroke-width="1.5"/>`}const mid=(a+a2)/2;paths+=`<text x="${(100+58*Math.cos(mid)).toFixed(1)}" y="${(104+58*Math.sin(mid)).toFixed(1)}" text-anchor="middle" font-size="13" fill="#222">${Math.round(100*c/total)}%</text>`;a=a2});return `<figure class="pie12"><figcaption>Escore de Pasto</figcaption><svg viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Escore de pasto">${paths}</svg><div class="leg12">${counts.map(([n,c],i)=>`<span><i style="background:${colors[i]}"></i>${esc(n)} (${c})</span>`).join('')}</div><p class="small">Contagem de ${total} avaliação(ões) por classe; não representa porcentagem da área.</p></figure>`}
function reportHTML(f,opt={}){const mn=id=>f.modules.find(m=>m.id===id)?.name||'Módulo';const v=f.visit||{},t=farmTotals(f),consultant=v.consultant||settings12.consultant||'',secs=[];let n=0;const add=(key,title,auto)=>{auto=(auto||'')+(typeof reportExtra==='function'?reportExtra(key,f):'');const lines=recLines(f,key);if(!lines.length&&!auto)return;n++;secs.push(`<h2>${key==='final'?'Considerações finais:':n+'.0 '+title+':'}</h2>${bullets(lines)}${auto||''}`);if(key==='final')n--};
 const modRows=[];for(const m of f.modules){const s=modStats(m,f);const cats=s.lots.flatMap(l=>(l.current?.categories||[]).map(c=>({l,c})));if(!cats.length){modRows.push([m.name||'',m.paddocks||'',fmtN(s.area)+' ha','','','','0,0 UA',s.pasture?'0,0 UA/ha':''])}else cats.forEach(({l,c},i)=>{const q=num(c.count),w=num(c.weight);const ua=q!==null&&w!==null?q*w/kgUAof(f):null;modRows.push(i?['','','',q!==null?fmtI(q)+' animais':'',c.name||l.name||'',w!==null?fmtI(w)+' kg':'',fmtN(ua)+' UA','']:[m.name||'',m.paddocks||'',fmtN(s.area)+' ha',q!==null?fmtI(q)+' animais':'',c.name||l.name||'',w!==null?fmtI(w)+' kg':'',fmtN(ua)+' UA',s.pasture&&s.uaha!==null?fmtN(s.uaha)+' UA/ha':''])})}
 const lotacao=t.area>0?`<p>- Lotação estimada de <b>${fmtN(t.uaha,2)} UA/ha</b> (considerando ${fmtN(t.area)} ha de área efetiva de pastagem). Total de ${fmtI(t.count)} animais${t.unknown?' (há lotes com contagem ou peso pendente)':''}.</p>`:'';
 add('rebanho','REBANHO',f.lots.length?lotacao+table12(['Módulo','Nº piquetes','Área ef.','Nº animais','Categoria','Peso','UA','UA/ha'],modRows,['TOTAL','',fmtN(t.area)+' ha',fmtI(t.count)+' animais','','',fmtN(t.ua)+' UA',fmtN(t.uaha)+' UA/ha']):'');
 const rep=f.lots.filter(l=>l.reproductionV6?.participates).map(l=>`${l.name||'Lote'}: ${l.reproductionV6.participates==='yes'?'participa da reprodução — '+({natural:'monta natural',insemination:'inseminação',both:'inseminação e monta natural'}[l.reproductionV6.method]||'método não informado'):'não participa da reprodução'}.`);
 add('reproducao','REPRODUÇÃO',rep.length?bullets(rep):'');add('sanidade','SANIDADE','');
 const feedRows=[],fez={};for(const m of f.modules)for(const l of f.lots.filter(l=>l.moduleId===m.id)){const s=lotStats(l,f),d=lotFeed(l,f);if(l.v12?.fezes)fez[l.v12.fezes]=(fez[l.v12.fezes]||0)+1;if(!d.name)continue;feedRows.push([m.name||'',s.count!==null?fmtI(s.count)+' animais':'',(l.current?.categories||[]).map(c=>c.name).filter(Boolean).join(', ')||l.name||'',s.weight!==null?fmtI(s.weight)+' kg':'',d.name,fmtN(d.dose,3)+' kg',fmtN(d.lotKg,0)+' kg',fmtN(d.bags,1)+' scs'])}
 const stock=stockRows(f),fezTxt=Object.keys(fez).length?`<p>- Escore de fezes: ${Object.keys(fez).sort().map(k=>`escore ${k} em ${fez[k]} lote(s)`).join('; ')}.</p>`:'';
 add('nutricao','NUTRIÇÃO',(feedRows.length?'<p>- Os animais deverão seguir a seguinte nutrição:</p>'+table12(['Módulo','Nº animais','Categoria','Peso','Suplemento','Consumo/animal','Consumo lote','Sacos'],feedRows,['TOTAL','','','','','',fmtN(t.feed,0)+' kg','']):'')+fezTxt+(stock.length?'<p>- Necessidade de compra:</p>'+table12(['Produto','Estoque','Consumo diário','Necessidade para 30 dias'],stock.map(r=>[r.name,r.est!==null?fmtI(r.est)+' kg':'não informado',fmtI(r.daily)+' kg',r.need30>0?fmtI(r.need30)+' kg':'estoque suficiente'])):''));
 const scores=Object.values(v.modV12||{}).map(x=>x.pasto).filter(Boolean);const legacy=scores.length?[]:f.lots.flatMap(l=>(l.sections?.pastagens?.groups?.piquetes||[]).map(r=>normalizeClass(r.classe)).filter(Boolean));const all=scores.length?scores:legacy;
 const modObs=f.modules.map(m=>[m.name,v.modV12?.[m.id]?.obs]).filter(([,o])=>o).map(([nm,o])=>nm+': '+o);
 add('pastos','PASTOS',(all.length?pie12(pastureClasses.map(c=>[c,all.filter(x=>x===c).length])):'')+bullets(modObs));
 const cochoRows=f.lots.map(l=>({l,d:lotFeed(l,f)})).filter(({d})=>d.cocho!==null).map(({l,d})=>[mn(l.moduleId)+' · '+(l.name||'Lote'),d.name||'—',fmtN(d.cocho,1)+' m',fmtN(d.cochoNeed,1)+' m',d.cochoAdj===null?'—':(d.cochoAdj>=0?'+':'')+fmtN(d.cochoAdj,1)+' m']);
 const cochoStd=[...new Set(f.lots.map(l=>l.v12?.supp).filter(Boolean))].map(suppOf).filter(Boolean).map(s=>`${s.name}: ${fmtN(num(s.cocho),0)} cm por cabeça`);
 add('infra','INFRAESTRUTURA',(cochoStd.length?'<p>- Tamanhos de cocho por animal:</p>'+bullets(cochoStd):'')+(cochoRows.length?table12(['Módulo · Lote','Suplemento','Cocho existente','Necessário','Ajuste'],cochoRows):''));
 add('gestao','GESTÃO','');
 const finalAuto=(v.nextVisit?`<p>- Próxima visita será no dia ${esc(brDate(v.nextVisit))}.</p>`:'')+`<p class="sign12">Qualquer dúvida estou à disposição,<br><br><b>${esc(consultant)}</b><br>Consultor Técnico${settings12.professional?'<br>'+esc(settings12.professional):''}</p>`;

 const since=v.startedAt||'';const photos=opt.photos?f.lots.flatMap(l=>l.attachments.filter(a=>a.type?.startsWith('image/')&&(!since||String(a.capturedAt||'')>=since)).map(a=>({a,l}))):[];
 return `<div class="rep12"><img class="rlogo12" src="${logoSrc}" alt="RP Gestão Agro"><p class="rtitle12">Relatório personalizado de Consultoria</p><p class="rmeta12">Consultor responsável: ${esc(consultant)}<br>Data: ${esc(brDate(v.date)||'—')}<br>Propriedade: ${esc(f.property.name||'—')}.</p><p class="rfarm12">${esc((f.property.name||'').toUpperCase())}</p>${secs.join('')}${photos.length?`<h2>Registro fotográfico</h2><div class="ph12">${photos.map(({a,l})=>`<figure><img src="${a.data}" alt=""><figcaption>${esc(mn(l.moduleId))} · ${esc(l.name||'')}${a.caption?' — '+esc(a.caption):''}</figcaption></figure>`).join('')}</div>`:''}</div>`}

function findPlant(q){const t=vnorm(q);let best=null,bs=0;for(const p of PLANTS){for(const name of [p.nome,...p.nome.split('/'),p.outros,p.sci]){const n=vnorm(name);if(!n)continue;let s=0;if(t===n)s=100;else if(n.split(' ').length>1&&t.includes(n))s=90;else if(new RegExp('\\b'+n.split(' ')[0]+'\\b').test(t)&&n.split(' ')[0].length>4)s=70;for(const w of n.split(' '))if(w.length>4&&t.split(' ').includes(w))s=Math.max(s,75);if(s>bs){bs=s;best=p}}}return bs>=70?best:null}

 for(const [f,md,dose] of p.doses){const F=HERB_FORMS[f];if(mode&&md!==mode&&!(mode==='local'&&md==='total'))continue;const parts=[`${F.ai}: ${dose} (${md==='total'?'área total':'aplicação localizada'}; ${F.src})`];const nums=String(dose).match(/(\d+(?:,\d+)?)(?:–(\d+(?:,\d+)?))? L\/ha/);
  if(md==='total'){if(plat==='drone')parts.push(`Drone (ARP): calda mínima ${F.drone} L/ha${area>0?' → ≥ '+fmtI(F.drone*area)+' L de calda em '+fmtN(area)+' ha':''}; ${F.adjD}`);else parts.push(`${plat==='costal'?'Costal':'Trator'}: calda ${F.ter[0]}–${F.ter[1]} L/ha${area>0?' → '+fmtI(F.ter[0]*area)+'–'+fmtI(F.ter[1]*area)+' L em '+fmtN(area)+' ha':''}; ${F.adjT}`);if(nums&&area>0){const a=numOf(nums[1]),b=nums[2]?numOf(nums[2]):a;parts.push(`Produto: ${fmtN(a*area,1)}${b!==a?'–'+fmtN(b*area,1):''} L para ${fmtN(area)} ha`)}}
  else parts.push('Calda até o ponto de escorrimento nas folhas, planta a planta (costal ou tratorizado); volume de produto não deve passar de 5,0 L/ha; óleo mineral 0,5% v/v.');

 if(mode==='total')out.lines.push('Infestação acima de 40%: aplicação em área total (Embrapa).');

fertRecommendation=function(m,f){if(fertOnly16&&!needsFert(m,f))return {warn:[],notes:[],missing:[],c:null,fg:null,par:moduleRecParams(m)};const out=fertV15(m,f),c=out.c,p=out.par,fg=out.fg;if(!c||!p.level)return out;
 out.missing=out.missing.filter(x=>!/calagem|acidez/.test(x));const est=p.phase==='estab',f05=est?1:0.5,prnt=num(p.prnt)>0?num(p.prnt):null,ad=fg&&ACID[fg.acid],methods=[];
 if(ad&&c.Al!==null&&c.t!==null&&c.Ca!==null&&c.Mg!==null&&c.clay!==null&&prnt){const cl=c.clay,Y=cl<15?cl/15:cl<35?1+(cl-15)/20:cl<60?2+(cl-35)/25:Math.min(4,3+(cl-60)/40);const CA=Math.max(0,Y*(c.Al-ad.mt*c.t/100)),CD=Math.max(0,ad.X-(c.Ca+c.Mg));methods.push({name:'Neutralização do Al e Ca+Mg (5ª Aproximação MG)',t:(CA+CD)*100/prnt*f05,txt:`Y = ${fmtN(Y,2)}; mt = ${ad.mt}%; X = ${fmtN(ad.X,1)} cmolc/dm³`})}
 const V2=p.level==='alto'?(est?60:50):ad?V2_GROUP[fg.acid]:null;
 if(c.T!==null&&c.V!==null&&prnt&&V2)methods.push({name:'Saturação por bases',t:Math.max(0,c.T*(V2-c.V)/prnt)*f05,txt:`T = ${fmtN(c.T,2)}; V1 = ${fmtN(c.V,0)}%; V2 = ${V2}% (${p.level==='alto'?'nível alto, Embrapa 2020':'grupo da forrageira, Boletim 100 IAC'})`});

 if(!ad)out.missing.push('adaptação da forrageira à acidez (banco de forrageiras)');if(!prnt)out.missing.push('PRNT do calcário');if(c.clay===null)out.missing.push('argila (método MG)');
 const ratio=c.Ca!==null&&c.Mg>0?c.Ca/c.Mg:null;let type='',why='';
 if(c.Mg!==null&&c.Mg<=0.45){type='dolomítico';why='Mg ≤ 0,45 cmolc/dm³'}else if(ratio!==null&&ratio<1){type='calcítico';why=`relação Ca:Mg invertida (${fmtN(ratio,2)}:1)`}else if(ratio!==null&&ratio<3){type='calcítico ou magnesiano';why=`Ca:Mg ${fmtN(ratio,1)}:1, abaixo de 3:1`}else if(ratio!==null&&ratio>6){type='dolomítico';why=`Ca:Mg ${fmtN(ratio,1)}:1, acima de 6:1`}else if(ratio!==null){type='dolomítico ou magnesiano';why=`Ca:Mg ${fmtN(ratio,1)}:1, dentro de 3 a 6:1`}
 if(ratio!==null&&ratio<1)out.notes.push(`Relação Ca:Mg invertida (${fmtN(ratio,2)}:1; ideal 3 a 6:1 — Embrapa, 2020). Se houver calagem, use calcário calcítico. Para fornecer Ca sem elevar o pH, gesso agrícola.`);
 if(methods.length){const best=methods.reduce((a,b)=>b.t>a.t?b:a);out.lime={t:best.t,prnt,type,why,methods,none:best.t<=0.05,method:methods.map(x=>`${x.name}: ${fmtN(x.t,2)} t/ha (${x.txt})`).join(' · ')+` — usada a maior dose, corrigida pelo PRNT de ${fmtI(prnt)}%${est?'':'; manutenção: camada 0–10 cm (× 0,5)'}.`};if(methods.length<2)out.notes.push('Só um método de calagem pôde ser calculado com os dados informados; o outro precisa de '+(methods[0].name.startsWith('Sat')?'Al, Ca, Mg, argila e a adaptação da forrageira':'H+Al (CTC e V%)')+'.')}else{delete out.lime;out.missing.push('dados para a calagem (Al, Ca, Mg, argila, H+Al e PRNT)')}
 return out};

function cvs(w,h,draw){const s=2,c=document.createElement('canvas');c.width=w*s;c.height=h*s;const g=c.getContext('2d');g.scale(s,s);g.fillStyle='#fff';g.fillRect(0,0,w,h);g.textBaseline='middle';draw(g,w,h);return `<img class="ch17" src="${c.toDataURL('image/png')}" width="${w}" height="${h}" alt="">`}

function trunc(g,t,max){t=String(t);if(g.measureText(t).width<=max)return t;while(t.length>1&&g.measureText(t+'…').width>max)t=t.slice(0,-1);return t+'…'}
function chartDonut(title,items,opt={}){items=items.filter(x=>x[1]>0);const tot=items.reduce((a,x)=>a+x[1],0);if(!tot)return '';const W=opt.w||340,H=Math.max(190,46+items.length*22);return cvs(W,H,(g)=>{font(g,14,1);g.fillStyle=CH.green;g.fillText(title,10,16);const cx=95,cy=H/2+10,R=72,r=44;let a=-Math.PI/2;items.forEach(([n,v,col],i)=>{const a2=a+2*Math.PI*v/tot;g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,a,a2);g.closePath();g.fillStyle=col||CH.pal[i%CH.pal.length];g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();a=a2});g.beginPath();g.arc(cx,cy,r,0,2*Math.PI);g.fillStyle='#fff';g.fill();font(g,16,1);g.fillStyle=CH.green;g.textAlign='center';g.fillText(opt.center??fmtI(tot),cx,cy-6);font(g,10);g.fillStyle=CH.muted;g.fillText(opt.centerLabel||'total',cx,cy+12);g.textAlign='left';

function chartBars(title,items,opt={}){items=items.filter(x=>x[1]!==null&&Number.isFinite(x[1]));if(!items.length)return '';const W=opt.w||680,rowH=opt.rowH||22,H=40+items.length*rowH+(opt.ref!==undefined?16:6);const max=Math.max(...items.map(x=>Math.max(x[1],x[3]??0)),opt.ref||0)*1.12||1;const L=opt.labelW||150,R=W-60;
 return cvs(W,H,g=>{font(g,14,1);g.fillStyle=CH.green;g.fillText(title,10,16);font(g,10);g.fillStyle=CH.muted;if(opt.unit){g.textAlign='right';g.fillText(opt.unit,W-8,16);g.textAlign='left'}const x=v=>L+(R-L)*v/max;

  if(opt.ref!==undefined){g.setLineDash([5,4]);g.strokeStyle=CH.gold;g.lineWidth=1.5;g.beginPath();g.moveTo(x(opt.ref),30);g.lineTo(x(opt.ref),H-14);g.stroke();g.setLineDash([]);font(g,10,1);g.fillStyle=CH.gold;g.fillText((opt.refLabel||'média')+' '+fmtN(opt.ref,opt.dec??1),Math.min(x(opt.ref)+4,W-120),H-7)}})}
// Paired bars: items [label, a, b]; legend names.
function chartPairs(title,items,names,opt={}){items=items.filter(x=>x[1]!==null||x[2]!==null);if(!items.length)return '';const W=opt.w||680,rowH=30,H=48+items.length*rowH;const max=Math.max(...items.flatMap(x=>[x[1]||0,x[2]||0]))*1.15||1,L=opt.labelW||150,R=W-60;
 return cvs(W,H,g=>{font(g,14,1);g.fillStyle=CH.green;g.fillText(title,10,16);font(g,10);[[names[0],CH.green],[names[1],CH.gold]].forEach(([n,c],i)=>{g.fillStyle=c;g.fillRect(W-260+i*130,11,10,10);g.fillStyle=CH.text;g.fillText(n,W-246+i*130,16)});const x=v=>L+(R-L)*v/max;

function techTexts(f){const v=f.visit||{},t=farmTotals(f),G=[],F=[],P=[];const mods=f.modules.filter(m=>(m.use||'pasture')==='pasture'),sc=mods.map(m=>v.modV12?.[m.id]?.pasto).filter(Boolean);const segs={};for(const l of f.lots){const k=l.v12?.segType||'Sem tipo';const s=lotStats(l,f);segs[k]=(segs[k]||0)+(s.count||0)}
 // Gestão

 const inv=invCompare(f);if(inv){G.push(inv.diff===0?`Inventário: a contagem de campo (${fmtI(inv.field)} cabeças) confere com o sistema da fazenda.`:`Inventário: a contagem de campo (${fmtI(inv.field)} cabeças) difere em ${inv.diff>0?'+':''}${fmtI(inv.diff)} cabeças do registrado no sistema da fazenda (${fmtI(inv.total)}). A diferença deve ser conciliada antes do fechamento do mês: erros de inventário distorcem a mortalidade, o desfrute e as arrobas produzidas, que são a base da avaliação econômica.`);if(inv.diff!==0)P.push('Conciliar o inventário de campo com o sistema da fazenda.')}
 const ind=indicators(f);if(ind.days&&Number.isFinite(ind.arrHaAno))G.push(`Desempenho do período (${ind.days} dias): produção de ${fmtN(ind.arrobas,0)} @ (${fmtN(ind.arrHaAno,1)} @/ha/ano), GMD médio do rebanho de ${fmtN(ind.gmd,3)} kg/dia e mortalidade de ${fmtN(ind.mort,1)}%. A produtividade em @/ha/ano é o principal indicador de eficiência do uso da terra e deve ser acompanhada visita a visita.`);
 const feed=t.feed,feedR=t.feedReal,bag=num(settings12.bagKg)||30;if(feed>0){const st=stockRows(f).filter(r=>r.est!==null&&r.daily>0);G.push(`Suplementação: o consumo previsto soma ${fmtI(feed)} kg/dia (${fmtN(feed/bag,1)} sacos)${feedR>0?` e o realizado informado, ${fmtI(feedR)} kg/dia (${fmtI(100*feedR/feed)}% do previsto)`:''}.${st.length?' Com o estoque informado, a cobertura é de '+st.map(r=>fmtI(r.est/r.daily)+' dias de '+r.name).join(', ')+'.':''}${st.some(r=>r.est/r.daily<30)?' Programar a compra para não haver falta de suplemento — interrupções reduzem o desempenho e exigem nova adaptação dos animais.':''}`)}
 const plan=(v.planV13||[]).filter(a=>a.acao&&a.status!=='Concluída');if(plan.length){const hi=plan.filter(a=>(a.prio||'Média')==='Alta');G.push(`Plano de ação: ${plan.length} ação(ões) em aberto${hi.length?', com prioridade alta para '+hi.map(a=>a.acao+(a.prazo?' (até '+brDate(a.prazo)+')':'')).join('; '):''}.`);for(const a of hi.slice(0,2))P.push(a.acao)}
 const noReal=f.lots.filter(l=>lotFeed(l,f).name&&lotFeed(l,f).real===null).length;if(noReal)G.push(`Registros: ${noReal} segmento(s) sem consumo de suplemento realizado anotado. O registro diário do fornecimento, das mortes e das mudanças de segmento é indispensável para calcular os indicadores e ajustar a estratégia nutricional.`);
 // Considerações finais
 if(sc.length){const n=k=>sc.filter(x=>x===k).length,bad=n('Super-pastejo')+n('Altura de saída'),sub=n('Sub-pastejo');F.push(`Pastagens: dos ${sc.length} módulos avaliados${v.season?' na '+SEASON_T(v.season):''}, ${bad} estão em superpastejo ou na altura de saída e ${sub} em subpastejo. ${bad?'Nos módulos rebaixados, respeitar a altura de saída do padrão RP e o período de descanso evita a perda de vigor, a abertura de touceiras e a entrada de invasoras. ':''}${sub?'Nos módulos em subpastejo, antecipar a entrada dos animais evita o acúmulo de colmo e material morto, que reduz o valor nutritivo da forragem. ':''}`.trim());if(bad)P.push('Ajustar a lotação e o período de descanso dos módulos em superpastejo.')}
 const comp=(()=>{const m=mods.find(m=>m.forageId&&forageOf(m.forageId)?.comp?.[v.season]);return m?{fg:forageOf(m.forageId),c:forageOf(m.forageId).comp[v.season]}:null})();
 const ca=catAnalysis(f);if(ca.length){const byN={};for(const x of ca)for(const k of x.low)(byN[k]=byN[k]||[]).push((x.l.name||'')+' · '+(x.c.name||''));const lowE=byN.NDT,lowP=byN.PB,minerals=Object.keys(byN).filter(k=>!['NDT','PB'].includes(k));
  F.push(`Nutrição: foram avaliadas ${ca.length} categorias pelo BR-CORTE 2023/NRC 2000.${comp?` Na ${SEASON_T(v.season)}, a forragem de ${comp.fg.name.replace(/^.*cv\. /,'')} tem em média ${fmtN(num(comp.c.PB),1)}% de PB e ${fmtN(num(comp.c.NDT),0)}% de NDT (CQBAL).`:''} ${lowE?`Há déficit de energia (NDT) em ${lowE.join('; ')}: a energia é o primeiro limitante do ganho de peso e o ajuste passa pelo aumento do consumo de suplemento energético ou da oferta de forragem de qualidade. `:''}${lowP?`Há déficit de proteína em ${lowP.join('; ')}: com menos de 7% de PB na dieta a atividade microbiana do rúmen é limitada (Van Soest, 1994) e cai o consumo e a digestão da fibra; a suplementação nitrogenada de forragem de baixa qualidade aumenta o consumo e a digestibilidade (Lazzarini et al., 2009).`:''}${minerals.length?`Minerais abaixo da exigência: ${minerals.join(', ')} — rever o mineral fornecido e o consumo realizado. `:''}${!lowE&&!lowP&&!minerals.length?'As categorias avaliadas atendem às exigências com o consumo informado.':''}`.trim());if(lowE||lowP)P.push('Corrigir os déficits de energia/proteína apontados na tabela de exigências.')}
 const under=f.lots.map(l=>({l,fd:lotFeed(l,f)})).filter(x=>x.fd.realPct!==null&&x.fd.realPct<80);if(under.length)F.push(`Consumo de suplemento abaixo do previsto em ${under.map(x=>(x.l.name||'segmento')+' ('+fmtI(x.fd.realPct)+'%)').join(', ')}. Avaliar a disponibilidade e a qualidade do pasto, o acesso e o espaço de cocho, a água e a palatabilidade do produto; consumo baixo e irregular compromete o atendimento das exigências.`);
 const san=(v.sanV16||[]).filter(it=>it.produto);const atr=Object.entries(v.sanChkV17?.vac||{}).filter(([,s])=>s==='Atrasada').map(([k])=>k.split(' (')[0]);const par=Object.entries(v.sanChkV17?.par||{}).filter(([,s])=>Number(s)>=2).map(([k])=>k.toLowerCase());if(san.length||atr.length||par.length){F.push(`Sanidade: ${san.length?'programada a aplicação de '+san.map(it=>it.produto).join(', ')+' conforme a tabela de dosagem por peso. ':''}${atr.length?'Vacinas atrasadas: '+atr.join(', ')+' — regularizar com prioridade. ':''}${par.length?'Infestação média/alta de '+par.join(', ')+': controle estratégico conforme o calendário sanitário, com rotação de princípios ativos para retardar a resistência.':''}`.trim());if(atr.length)P.push('Regularizar as vacinas atrasadas.')}
 const lime=f.modules.filter(m=>needsFert(m,f)).map(m=>({m,r:fertRecommendation(m,f)})).filter(x=>x.r.lime&&!x.r.lime.none);if(lime.length)F.push(`Solo: há recomendação de calagem em ${lime.map(x=>x.m.name+' ('+fmtN(x.r.lime.t,1)+' t/ha de calcário '+(x.r.lime.type||'')+')').join(', ')}. A correção da acidez deve anteceder a adubação de N, P e K para que os nutrientes sejam aproveitados.`);
 const coc=f.lots.filter(l=>{const d=lotFeed(l,f);return d.cochoAdj!==null&&d.cochoAdj<0});const agua=f.modules.filter(m=>['Ruim','Sem água'].includes(v.modV12?.[m.id]?.agua));if(coc.length||agua.length){F.push(`Infraestrutura: ${coc.length?'cocho insuficiente em '+coc.map(l=>l.name).join(', ')+' — falta de espaço aumenta a dominância e a desuniformidade do consumo. ':''}${agua.length?'Água ruim ou ausente em '+agua.map(m=>m.name).join(', ')+'; a água limita diretamente o consumo de matéria seca.':''}`.trim());if(coc.length)P.push('Ampliar o cocho dos segmentos com falta.')}
 if(P.length)F.push('Prioridades até a próxima visita: '+[...new Set(P)].slice(0,5).map((x,i)=>(i+1)+') '+x.replace(/\.$/,'')).join('; ')+'.');
 return {gestao:G,final:F}}
completeTexts=function(f,quiet){if(quiet)return 0;const a=techTexts(f);f.visit.recV12=f.visit.recV12||{};let n=0;for(const k of ['gestao','final']){const cur=recLines(f,k),add=a[k].filter(x=>!cur.includes(x));if(add.length){f.visit.recV12[k]=[...cur,...add].join('\n');n+=add.length}}f.visit.autoV17=false;toast(n?'Análise copiada para Gestão e Considerações finais (a automática foi desligada para não repetir). Revise o texto.':'Nada novo para copiar.');return n};
